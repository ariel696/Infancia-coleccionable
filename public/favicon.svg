<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="orb" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#E9FFFB"/>
      <stop offset="0.25" stop-color="#7FE8F5"/>
      <stop offset="0.6" stop-color="#1FA7E8"/>
      <stop offset="1" stop-color="#0A5FB8"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7CF2B0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FF6B"/>
      <stop offset="1" stop-color="#2FBF4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="85%" r="50%">
      <stop offset="0" stop-color="#9DFFD2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9DFFD2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- sombra suave -->
  <ellipse cx="32" cy="60" rx="18" ry="3" fill="#0A5FB8" opacity="0.25"/>
  <!-- esfera de cristal -->
  <circle cx="32" cy="31" r="28" fill="url(#orb)"/>
  <circle cx="32" cy="31" r="27" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- brillo inferior verde-agua -->
  <ellipse cx="32" cy="50" rx="19" ry="9" fill="url(#glow)"/>
  <!-- hoja Frutiger Aero -->
  <path d="M20 44C18 30 28 20 46 19C47 36 38 46 20 44Z" fill="url(#leaf)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2"/>
  <path d="M22 43C28 35 35 28 43 23" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round"/>
  <!-- burbujas -->
  <circle cx="48" cy="40" r="4.5" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.2"/>
  <circle cx="46.7" cy="38.6" r="1.2" fill="#FFFFFF"/>
  <circle cx="15" cy="23" r="2.6" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/>
